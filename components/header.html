<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="header.css">
    <title>header</title>
</head>
<body>


        <!-- Top Bar Start -->
<header class="top-bar">
  
  <div class="top-bar__container container">

    <!-- Brand Start -->
    <div class="top-bar__brand">
      <a href="/" class="top-bar__logo" aria-label="Adidas Home">
        <span class="top-bar__logo-text">adidas</span>
      </a>
    </div>
    <!-- Brand End -->

    <!-- Mobile Menu Start -->
    <div class="top-bar__menu">
      <button
        class="top-bar__menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <img
          src="../img/burger-icon.png"
          alt=""
          class="top-bar__menu-icon"
        />
      </button>
    </div>
    <!-- Mobile Menu End -->

    <!-- Actions Start -->
    <div class="top-bar__actions">
      <!-- Membership Button Start -->
      <a
        href="#"
        class="top-bar__action-btn top-bar__action-btn--membership"
      >
        <span class="top-bar__action-text">Membership</span>
      </a>
      <!-- Membership Button End -->

      <!-- Account Button Start -->
      <a
        href="#"
        class="top-bar__action-btn top-bar__action-btn--account"
      >
        <span class="top-bar__action-text">Account</span>
      </a>
      <!-- Account Button End -->

    </div>
    <!-- Actions End -->

  
  
  
  
  
  
  </div>




  
</header>
<!-- Top Bar End -->
    
</body>
</html>
