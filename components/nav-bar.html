<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav-bar</title>
    <link rel="stylesheet" href="nav-bar.css">
</head>
<body>


<nav class="nav-bar" aria-label="Main navigation">
  <div class="nav-bar__container container">

    <ul class="nav-bar__menu">
      <li class="nav-bar__menu-item">
        <a href="#" class="nav-bar__menu-link">
          <span class="nav-bar__menu-text">OUR TRACKS</span>
        </a>
      </li>

      <li class="nav-bar__menu-item">
        <a href="#" class="nav-bar__menu-link">
          <span class="nav-bar__menu-text">FIND EVENTS</span>
        </a>
      </li>

      <li class="nav-bar__menu-item">
        <a href="#" class="nav-bar__menu-link">
          <span class="nav-bar__menu-text">TRACK MAP</span>
        </a>
      </li>

      <li class="nav-bar__menu-item">
        <a href="#" class="nav-bar__menu-link">
          <span class="nav-bar__menu-text">SHOP</span>
        </a>
      </li>

      <li class="nav-bar__menu-item">
        <a href="#" class="nav-bar__menu-link">
          <span class="nav-bar__menu-text">ABOUT US</span>
        </a>
      </li>
    </ul>

    <form class="nav-bar__search" action="#" role="search">
      <input
        id="site-search"
        type="search"
        class="nav-bar__search-input"
        placeholder="SEARCH"
      />

      <button type="submit" class="nav-bar__search-button">
        <img
          src="../img/search-icon.png"
          alt="Search"
          class="nav-bar__search-icon"
        />
      </button>
    </form>

  </div>
</nav>
    
</body>
</html>
